name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    # A throwaway database in the job. This job has no secrets and never touches a Supabase project.
    services:
      postgres:
        # The image the pinned Supabase CLI runs for Postgres 17 (supabase/config.toml), so it has
        # Supabase's roles, schemas and extensions. Bump it with the CLI.
        image: supabase/postgres:17.11.0.006
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Same command as pnpm db:push, so the dev project and CI apply migrations the same way.
      - name: Apply migrations
        run: pnpm exec supabase db push --db-url "$DATABASE_URL" --yes

      - name: Check schema
        run: psql "$DATABASE_URL" --no-psqlrc --file supabase/checks/schema.sql

      # The dev seed runs here only against this job's throwaway database: the job has no secrets.
      # It must refuse outside development and outside the seed script, and load cleanly twice.
      - name: Check the dev seed refuses to run elsewhere
        run: |
          if NODE_ENV=production node scripts/db-seed-dev.mjs; then exit 1; fi
          if psql "$DATABASE_URL" --no-psqlrc -v ON_ERROR_STOP=1 --file supabase/seeds/dev.sql; then
            exit 1
          fi

      - name: Load the dev seed twice
        env:
          NODE_ENV: development
        run: |
          node scripts/db-seed-dev.mjs | tee first-run.txt
          grep --quiet '^Seeded 9 new dev providers; 9 sample providers in total.$' first-run.txt
          node scripts/db-seed-dev.mjs | tee second-run.txt
          grep --quiet '^Seeded 0 new dev providers; 9 sample providers in total.$' second-run.txt

      - name: Check the dev seed
        run: psql "$DATABASE_URL" --no-psqlrc --file supabase/checks/dev_seed.sql

  api-integration:
    name: API integration
    runs-on: ubuntu-latest
    # The same throwaway database as the Migrations job. No secrets; never touches a Supabase project.
    services:
      postgres:
        image: supabase/postgres:17.11.0.006
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # The only database the integration tests and type generation accept (localhost only).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec supabase db push --db-url "$TEST_DATABASE_URL" --yes

      - name: Build shared
        run: pnpm build:shared

      # Fails, and prints the difference, if the migrations changed without regenerating the types.
      - name: Check database types
        run: |
          pnpm --filter @coldlink/api db:types
          git diff --exit-code -- apps/api/src/db/schema.ts

      - name: Integration tests
        run: pnpm --filter @coldlink/api test:integration

      # Seeds 500 providers into this job's throwaway database, times POST /search and fails if p95
      # is 500 ms or more (PRD 7.3). The rows are deleted afterwards.
      - name: Search benchmark
        run: pnpm --filter @coldlink/api bench:search
